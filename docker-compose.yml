services:
  web:
    build: .
    container_name: php_web_uts
    restart: always
    ports:
      - "9292:80" 
    volumes:
      - ./src:/var/www/html
    environment:
      DB_Host: db
      DB_User: root
      DB_Pass: secretpassword
      DB_Name: db_toko
      DB_Port: 3306
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: mysql_db_uts
    restart: always
    ports:
      - "3309:3306" 
    environment:
      MYSQL_ROOT_PASSWORD: secretpassword
      MYSQL_DATABASE: db_toko
    volumes:
      - db_data_uts:/var/lib/mysql 

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin_uts
    restart: always
    ports:
      - "8585:80" 
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: secretpassword
    depends_on:
      - db

volumes:
  db_data_uts: